[package]
name = "clonamic-core"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Portable write approval and completion verification core for Clonamic"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "clonamic"
path = "src/main.rs"

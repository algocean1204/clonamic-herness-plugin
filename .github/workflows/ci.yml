name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    env:
      CLONAMIC_TEST_TIMEOUT_SECONDS: "600"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/clonamic-ppt/package-lock.json
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - run: npm ci --prefix plugins/clonamic-ppt
      - run: npm audit --omit=dev --prefix plugins/clonamic-ppt
      - run: cargo fetch --locked
      - run: python scripts/validate-public.py
